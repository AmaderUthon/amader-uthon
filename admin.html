<!doctype html><html lang='bn'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>দোতলার বারান্দা — সম্পাদক ড্যাশবোর্ড</title><link rel='stylesheet' href='style.css'><main class='wrap section'><a href='index.html'>← ওয়েবসাইটে ফিরুন</a><h1>সম্পাদক ড্যাশবোর্ড</h1><p>এখানে লেখা যোগ করে এই ব্রাউজারে সংরক্ষণ করতে পারবেন।</p><form id='f' class='category'><p>শিরোনাম<br><input id='t' required style='width:100%;padding:10px'></p><p>লেখক<br><input id='a' required style='width:100%;padding:10px'></p><p>বিভাগ<br><select id='c' style='width:100%;padding:10px'><option>গল্প</option><option>কবিতা</option><option>প্রবন্ধ</option><option>স্মৃতিচারণ</option><option>ছবি</option></select></p><p>লেখা<br><textarea id='x' required rows='10' style='width:100%;padding:10px'></textarea></p><p>ছবির URL (ঐচ্ছিক)<br><input id='i' style='width:100%;padding:10px'></p><button class='btn'>প্রকাশ করুন</button></form><h2>প্রকাশিত লেখা</h2><div id='list'></div></main><script>let k='barandaArticles',d=JSON.parse(localStorage.getItem(k)||'[]');function r(){list.innerHTML=d.map((v,n)=>`<div class="category"><h3>${v.t}</h3><p>${v.c} · ${v.a}</p><p>${v.x}</p>${v.i?`<img src="${v.i}" style="max-width:250px">`:''}<br><button onclick="d.splice(${n},1);s()">মুছুন</button></div>`).join('')||'<p>কোনো লেখা নেই।'}function s(){localStorage.setItem(k,JSON.stringify(d));r()}f.onsubmit=e=>{e.preventDefault();d.unshift({t:t.value,a:a.value,c:c.value,x:x.value,i:i.value});s();f.reset();alert('লেখা প্রকাশিত হয়েছে')};r()</script></html>
