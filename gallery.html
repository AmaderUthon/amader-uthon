<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ছবি ও শিল্প | দোতলার বারান্দা</title><link rel="stylesheet" href="style.css"><style>.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}.gallery-card{background:#fff;border:1px solid #e8dfd2;padding:12px;box-shadow:0 6px 18px #0000000d}.gallery-card img{display:block;width:100%;height:220px;object-fit:cover;background:#f3eee7}.gallery-card h3{margin:12px 4px 4px}.gallery-card p{margin:0 4px;color:#766b61;font-size:.92rem}.empty{padding:25px;background:#fffaf4}</style></head><body><header><div class="masthead"><h1>দোতলার বারান্দা</h1><p>ছবি ও স্মৃতির অ্যালবাম</p></div><nav><a href="index.html">প্রচ্ছদ</a><a href="index.html#posts">লেখা</a></nav></header><main class="section"><h2>ছবি ও শিল্প</h2><div id="gallery" class="gallery-grid"><div class="empty">ছবি লোড হচ্ছে…</div></div></main><script src="script.js"></script><script>
const CSV='https://docs.google.com/spreadsheets/d/1YCfoVNaRcGLA_n6Om9eXLoLmdvVQbh-T6Javx306ZTM/gviz/tq?tqx=out:csv';
function csv(t){const a=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===','&&!q){r.push(c);c='';continue}if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);if(r.some(v=>v.trim()))a.push(r);r=[];c='';continue}c+=x}if(c||r.length){r.push(c);a.push(r)}return a}
function nm(s){return String(s||'').toLowerCase().replace(/[\s_\-]/g,'')}
function ci(h,terms){return h.findIndex(x=>terms.some(t=>nm(x).includes(nm(t))))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function img(v){const s=String(v||'').trim();if(!s)return '';const m=s.match(/(?:file\/d\/|open\?id=|[?&]id=)([A-Za-z0-9_-]{15,})/);if(!m)return s;return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1200'}
(async()=>{const box=document.getElementById('gallery');try{const rows=csv(await (await fetch(CSV+'&v='+Date.now())).text());if(rows.length<2)throw 0;const h=rows[0],ix={title:ci(h,['লেখারশিরোনাম','title']),author:ci(h,['লেখকেরনাম','author']),cat:ci(h,['লেখারবিভাগ','বিভাগ','category']),image:ci(h,['ছবিবাফাইলথাকলেদিন','ছবি','image','file']),status:ci(h,['status'])};const ok=['approved','অনুমোদিত','প্রকাশিত','published'];const items=rows.slice(1).map(r=>({title:r[ix.title],author:r[ix.author],cat:r[ix.cat],image:img(r[ix.image]),status:nm(r[ix.status])})).filter(p=>ok.includes(p.status)&&p.image&&/(ছবি|শিল্প|photo|image|gallery|ফটোগ্রাফ)/i.test(p.cat||''));if(!items.length){box.innerHTML='<div class="empty">এখনও ছবি বিভাগে কোনো অনুমোদিত ছবি প্রকাশিত হয়নি।</div>';return}box.innerHTML=items.map(p=>'<article class="gallery-card"><a href="'+esc(p.image)+'" target="_blank"><img src="'+esc(p.image)+'" alt="'+esc(p.title)+'"></a><h3>'+esc(p.title||'ছবি')+'</h3><p>'+esc(p.author||'পরিবারের একজন সদস্য')+'</p></article>').join('')}catch(e){box.innerHTML='<div class="empty">ছবি লোড করা যাচ্ছে না।</div>'}})();
</script></body></html>
